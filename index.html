<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Côte-Nord Mafia — Sept-Îles</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, 0.78);
      --panel-border: rgba(148, 163, 184, 0.28);
      --accent: #38bdf8;
      --danger: #ef4444;
      --ok: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, Segoe UI, Roboto, Arial, sans-serif; }

    #game {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      z-index: 400;
      pointer-events: none;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 100;
      filter: saturate(1.05) contrast(1.03) brightness(0.95);
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      padding: 10px 12px;
    }

    .stats {
      display: grid;
      gap: 8px;
    }

    .bar {
      height: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(100, 116, 139, 0.35);
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 100%;
      transition: width 0.2s linear;
    }

    .health { background: linear-gradient(90deg, #f97316, #ef4444); }
    .stamina { background: linear-gradient(90deg, #22d3ee, #3b82f6); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .wanted {
      font-size: 18px;
      letter-spacing: 2px;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
      white-space: nowrap;
    }

    .status {
      position: absolute;
      top: 126px;
      left: 10px;
      max-width: min(85vw, 520px);
      pointer-events: none;
      font-size: 13px;
      color: var(--muted);
    }

    .status.error { color: #fca5a5; }
    .status.ok { color: #86efac; }

    .controls {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(96px, 1fr));
      gap: 10px;
      width: min(54vw, 230px);
      pointer-events: auto;
    }

    .btn {
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.86);
      color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 10px;
      touch-action: manipulation;
      box-shadow: var(--shadow);
      cursor: pointer;
      user-select: none;
    }

    .btn:active { transform: scale(0.98); }
    .btn.crime { border-color: rgba(239, 68, 68, 0.6); }
    .btn.interact { border-color: rgba(56, 189, 248, 0.6); }

    .zoom-controls {
      position: absolute;
      right: 10px;
      top: 152px;
      display: grid;
      gap: 8px;
      pointer-events: auto;
    }

    .zoom-btn {
      width: 46px;
      height: 46px;
      font-size: 24px;
      line-height: 1;
      border-radius: 10px;
    }

    .joystick {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: min(38vw, 180px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(148, 163, 184, 0.4);
      background: radial-gradient(circle at 35% 35%, rgba(148, 163, 184, 0.23), rgba(15, 23, 42, 0.72));
      box-shadow: var(--shadow);
      pointer-events: auto;
      touch-action: none;
      overflow: hidden;
    }

    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      aspect-ratio: 1/1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(125, 211, 252, 0.9), rgba(30, 58, 138, 0.95));
      border: 2px solid rgba(224, 242, 254, 0.8);
      box-shadow: 0 8px 18px rgba(14, 116, 144, 0.45);
      pointer-events: none;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(11, 18, 32, 0.86), rgba(2, 6, 23, 0.95));
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    #loadingOverlay.hidden { opacity: 0; }

    .loading-card {
      width: min(92vw, 560px);
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.78);
      box-shadow: var(--shadow);
      padding: 18px;
      text-align: center;
    }

    .loading-card h1 { margin: 0 0 8px; font-size: clamp(20px, 4vw, 32px); }
    .loading-card p { margin: 6px 0; color: var(--muted); }

    @media (max-width: 640px) {
      .hud { grid-template-columns: 1fr; }
      .wanted { font-size: 16px; }
      .status { top: 158px; font-size: 12px; }
      .controls { width: min(56vw, 220px); grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Carte de Sept-Îles"></div>
  <canvas id="game" aria-label="Jeu Côte-Nord Mafia"></canvas>

  <div class="ui-layer">
    <div class="hud">
      <div class="panel stats">
        <div class="row"><strong>Santé</strong><span id="healthText">100</span></div>
        <div class="bar"><span id="healthBar" class="health"></span></div>
        <div class="row"><strong>Énergie</strong><span id="staminaText">100</span></div>
        <div class="bar"><span id="staminaBar" class="stamina"></span></div>
        <div class="row"><span>Argent: <strong id="moneyText">$1500</strong></span><span id="speedText">Vitesse: 0</span></div>
      </div>
      <div class="panel wanted" id="wantedStars">☆☆☆☆☆</div>
    </div>

    <div id="statusMsg" class="status">Initialisation de la ville...</div>

    <div class="zoom-controls">
      <button id="zoomIn" class="btn zoom-btn" type="button" aria-label="Zoom avant">+</button>
      <button id="zoomOut" class="btn zoom-btn" type="button" aria-label="Zoom arrière">−</button>
    </div>

    <div class="joystick" id="joystick" aria-label="Joystick virtuel">
      <div class="knob" id="joyKnob"></div>
    </div>

    <div class="controls">
      <button id="runBtn" class="btn" type="button">COURIR</button>
      <button id="interactBtn" class="btn interact" type="button">ENTRER/SORTIR</button>
      <button id="crimeBtn" class="btn crime" type="button">CRIME</button>
      <button id="brakeBtn" class="btn" type="button">FREIN</button>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="loading-card">
      <h1>Côte-Nord Mafia</h1>
      <p>Chargement de Sept-Îles...</p>
      <p id="loadDetail">Préparation du moteur de jeu.</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    (() => {
      'use strict';

      const CITY = { lat: 50.213, lon: -66.38 };
      const MAX_ZOOM = 18;
      const MIN_ZOOM = 12;
      const ROAD_FETCH_TIMEOUT_MS = 7000;
      const SAT_TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
      const SAT_LABELS_URL = 'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
      const OSM_TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
      const KEY_ALIAS = {
        arrowup: 'up', w: 'up',
        arrowdown: 'down', s: 'down',
        arrowleft: 'left', a: 'left',
        arrowright: 'right', d: 'right',
        shift: 'run',
        ' ': 'brake'
      };
      const PREVENT_DEFAULT_KEYS = new Set([
        'arrowup', 'arrowdown', 'arrowleft', 'arrowright',
        'w', 'a', 's', 'd', ' ', 'shift'
      ]);

      const dom = {
        map: document.getElementById('map'),
        canvas: document.getElementById('game'),
        healthBar: document.getElementById('healthBar'),
        staminaBar: document.getElementById('staminaBar'),
        healthText: document.getElementById('healthText'),
        staminaText: document.getElementById('staminaText'),
        moneyText: document.getElementById('moneyText'),
        speedText: document.getElementById('speedText'),
        wantedStars: document.getElementById('wantedStars'),
        statusMsg: document.getElementById('statusMsg'),
        loadDetail: document.getElementById('loadDetail'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        joystick: document.getElementById('joystick'),
        joyKnob: document.getElementById('joyKnob'),
        runBtn: document.getElementById('runBtn'),
        interactBtn: document.getElementById('interactBtn'),
        crimeBtn: document.getElementById('crimeBtn'),
        brakeBtn: document.getElementById('brakeBtn'),
        zoomIn: document.getElementById('zoomIn'),
        zoomOut: document.getElementById('zoomOut')
      };

      if (Object.values(dom).some((el) => !el)) {
        alert('Erreur DOM: certains éléments du jeu sont manquants.');
        throw new Error('Missing DOM elements');
      }

      class RNG {
        static range(min, max) { return Math.random() * (max - min) + min; }
        static int(min, max) { return Math.floor(RNG.range(min, max + 1)); }
      }

      class Joystick {
        constructor(root, knob) {
          this.root = root;
          this.knob = knob;
          this.activeId = null;
          this.vec = { x: 0, y: 0, force: 0 };
          this.radius = 0;
          this.center = { x: 0, y: 0 };
          this.bind();
          this.resize();
          window.addEventListener('resize', () => this.resize());
        }
        resize() {
          const rect = this.root.getBoundingClientRect();
          this.radius = rect.width * 0.36;
          this.center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          if (!this.activeId) this.reset();
        }
        bind() {
          const start = (e) => {
            if (this.activeId !== null) return;
            const point = this.getPoint(e);
            if (!point) return;
            this.activeId = point.id;
            if (this.root.setPointerCapture && e.pointerId !== undefined) {
              try { this.root.setPointerCapture(e.pointerId); } catch (_) {}
            }
            this.update(point.x, point.y);
            e.preventDefault();
          };
          const move = (e) => {
            if (this.activeId === null) return;
            const point = this.getPoint(e, this.activeId);
            if (!point) return;
            this.update(point.x, point.y);
            e.preventDefault();
          };
          const end = (e) => {
            if (this.activeId === null) return;
            const ended = this.hasId(e, this.activeId);
            if (ended || e.type === 'pointerup' || e.type === 'pointercancel') {
              this.activeId = null;
              this.reset();
            }
          };

          this.root.addEventListener('pointerdown', start, { passive: false });
          window.addEventListener('pointermove', move, { passive: false });
          window.addEventListener('pointerup', end, { passive: true });
          window.addEventListener('pointercancel', end, { passive: true });
        }
        hasId(e, id) {
          if (e.pointerId !== undefined) return e.pointerId === id;
          return true;
        }
        getPoint(e, targetId = null) {
          if (e.pointerId !== undefined) {
            if (targetId !== null && e.pointerId !== targetId) return null;
            return { x: e.clientX, y: e.clientY, id: e.pointerId };
          }
          return null;
        }
        update(x, y) {
          const dx = x - this.center.x;
          const dy = y - this.center.y;
          const dist = Math.hypot(dx, dy) || 1;
          const clamped = Math.min(dist, this.radius);
          const nx = dx / dist;
          const ny = dy / dist;
          const kx = nx * clamped;
          const ky = ny * clamped;

          this.knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
          this.vec.x = kx / this.radius;
          this.vec.y = ky / this.radius;
          this.vec.force = Math.min(1, clamped / this.radius);
        }
        reset() {
          this.vec.x = 0;
          this.vec.y = 0;
          this.vec.force = 0;
          this.knob.style.transform = 'translate(-50%, -50%)';
        }
      }

      class MapSystem {
        constructor() {
          this.map = null;
          this.roadSegments = [];
          this.roadNodes = [];
          this.roadAdj = [];
          this.roadNodeGrid = new Map();
          this.roadSegmentGrid = new Map();
          this.nodeCellSize = 0.0025;
          this.segmentCellSize = 0.0035;
          this.overpassReady = false;
          this.overpassFailed = false;
          this.baseLayers = {};
          this.labelsLayer = null;
          this.activeBaseLayer = null;
          this.tileFallbackTriggered = false;
        }

        initMap() {
          this.map = L.map(dom.map, {
            center: [CITY.lat, CITY.lon],
            zoom: 15,
            minZoom: MIN_ZOOM,
            maxZoom: MAX_ZOOM,
            zoomControl: false,
            attributionControl: true,
            preferCanvas: true
          });

          this.baseLayers.satellite = L.tileLayer(SAT_TILE_URL, {
            maxZoom: MAX_ZOOM,
            minZoom: MIN_ZOOM,
            attribution: 'Tiles &copy; Esri',
            crossOrigin: true
          });
          this.baseLayers.osm = L.tileLayer(OSM_TILE_URL, {
            maxZoom: MAX_ZOOM,
            minZoom: MIN_ZOOM,
            attribution: '&copy; OpenStreetMap contributors',
            crossOrigin: true
          });

          this.labelsLayer = L.tileLayer(SAT_LABELS_URL, {
            maxZoom: MAX_ZOOM,
            minZoom: MIN_ZOOM,
            attribution: 'Labels &copy; Esri',
            crossOrigin: true
          });

          this.activeBaseLayer = this.baseLayers.satellite;
          this.activeBaseLayer.addTo(this.map);
          this.labelsLayer.addTo(this.map);
          L.control.layers(
            { 'Satellite': this.baseLayers.satellite, 'OpenStreetMap': this.baseLayers.osm },
            { 'Étiquettes': this.labelsLayer },
            { collapsed: true }
          ).addTo(this.map);

          let satTileErrors = 0;
          this.baseLayers.satellite.on('tileerror', () => {
            satTileErrors += 1;
            if (satTileErrors >= 6) this.activateFallbackBase('Satellite indisponible, bascule OSM.');
          });
          this.baseLayers.satellite.on('load', () => { satTileErrors = 0; });
          this.baseLayers.osm.on('tileerror', () => {
            dom.statusMsg.textContent = 'Erreur tuiles carte: vérifie la connexion réseau.';
            dom.statusMsg.className = 'status error';
          });

          setTimeout(() => {
            if (!this.tileFallbackTriggered && satTileErrors > 0) {
              this.activateFallbackBase('Satellite instable, bascule OSM.');
            }
          }, 3500);
        }

        activateFallbackBase(message) {
          if (this.tileFallbackTriggered || !this.map) return;
          this.tileFallbackTriggered = true;
          if (this.activeBaseLayer && this.map.hasLayer(this.activeBaseLayer)) this.map.removeLayer(this.activeBaseLayer);
          this.activeBaseLayer = this.baseLayers.osm;
          this.activeBaseLayer.addTo(this.map);
          if (this.labelsLayer && !this.map.hasLayer(this.labelsLayer)) this.labelsLayer.addTo(this.map);
          dom.statusMsg.textContent = message;
          dom.statusMsg.className = 'status error';
        }

        async loadRoadsOptional() {
          const bbox = `${CITY.lat - 0.02},${CITY.lon - 0.03},${CITY.lat + 0.02},${CITY.lon + 0.03}`;
          const query = `[out:json][timeout:25];(way["highway"](${bbox}););out geom;`;

          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), ROAD_FETCH_TIMEOUT_MS);

          try {
            dom.loadDetail.textContent = 'Tentative de chargement des routes OSM (Overpass)...';
            const response = await fetch('https://overpass-api.de/api/interpreter', {
              method: 'POST',
              body: query,
              signal: controller.signal,
              headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            const ways = Array.isArray(data.elements) ? data.elements.filter((el) => el.type === 'way' && el.geometry?.length > 1) : [];
            const segments = [];

            for (const way of ways) {
              for (let i = 1; i < way.geometry.length; i += 1) {
                const a = way.geometry[i - 1];
                const b = way.geometry[i];
                segments.push([a.lat, a.lon, b.lat, b.lon]);
              }
            }

            this.roadSegments = segments;
            this.buildRoadGraph(ways);
            this.overpassReady = true;
            dom.statusMsg.textContent = segments.length ? `Routes chargées: ${segments.length} segments.` : 'Aucune route trouvée, mode libre actif.';
            dom.statusMsg.className = 'status ok';
          } catch (err) {
            this.overpassFailed = true;
            this.roadSegments = [];
            dom.statusMsg.textContent = 'Overpass indisponible: jeu lancé en mode libre sans routes détaillées.';
            dom.statusMsg.className = 'status error';
          } finally {
            clearTimeout(timeout);
          }
        }

        buildRoadGraph(ways) {
          const nodeByKey = new Map();
          const nodes = [];
          const adjacency = [];
          const quant = (v) => Number(v).toFixed(6);
          const keyOf = (lat, lon) => `${quant(lat)},${quant(lon)}`;
          const ensureNode = (lat, lon) => {
            const key = keyOf(lat, lon);
            if (nodeByKey.has(key)) return nodeByKey.get(key);
            const idx = nodes.length;
            nodes.push({ lat, lon });
            adjacency.push([]);
            nodeByKey.set(key, idx);
            return idx;
          };

          for (const way of ways) {
            const geom = way.geometry || [];
            for (let i = 1; i < geom.length; i += 1) {
              const a = geom[i - 1];
              const b = geom[i];
              const ai = ensureNode(a.lat, a.lon);
              const bi = ensureNode(b.lat, b.lon);
              if (ai !== bi) {
                adjacency[ai].push(bi);
                adjacency[bi].push(ai);
              }
            }
          }

          this.roadNodes = nodes;
          this.roadAdj = adjacency.map((neighbors) => [...new Set(neighbors)]);
          this.buildSpatialIndexes();
        }

        buildSpatialIndexes() {
          this.roadNodeGrid.clear();
          this.roadSegmentGrid.clear();
          for (let i = 0; i < this.roadNodes.length; i += 1) {
            const n = this.roadNodes[i];
            this.addToGrid(this.roadNodeGrid, n.lat, n.lon, this.nodeCellSize, i);
          }
          for (let i = 0; i < this.roadSegments.length; i += 1) {
            const s = this.roadSegments[i];
            const midLat = (s[0] + s[2]) / 2;
            const midLon = (s[1] + s[3]) / 2;
            this.addToGrid(this.roadSegmentGrid, midLat, midLon, this.segmentCellSize, i);
          }
        }

        gridKey(lat, lon, cellSize) {
          return `${Math.floor(lat / cellSize)}:${Math.floor(lon / cellSize)}`;
        }

        addToGrid(grid, lat, lon, cellSize, value) {
          const key = this.gridKey(lat, lon, cellSize);
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(value);
        }

        metersPerLon(lat) {
          return 111320 * Math.cos((lat * Math.PI) / 180);
        }

        distanceApproxMeters(lat1, lon1, lat2, lon2) {
          const dy = (lat2 - lat1) * 111320;
          const dx = (lon2 - lon1) * this.metersPerLon((lat1 + lat2) / 2);
          return Math.hypot(dx, dy);
        }

        hasRoadNetwork() {
          return this.roadNodes.length > 1 && this.roadAdj.length === this.roadNodes.length;
        }

        nearestRoadNode(lat, lon, maxRing = 2) {
          if (!this.hasRoadNetwork()) return null;
          const baseX = Math.floor(lat / this.nodeCellSize);
          const baseY = Math.floor(lon / this.nodeCellSize);
          let best = null;
          let bestD = Infinity;
          for (let ring = 0; ring <= maxRing; ring += 1) {
            for (let gx = baseX - ring; gx <= baseX + ring; gx += 1) {
              for (let gy = baseY - ring; gy <= baseY + ring; gy += 1) {
                const list = this.roadNodeGrid.get(`${gx}:${gy}`);
                if (!list) continue;
                for (const idx of list) {
                  const n = this.roadNodes[idx];
                  const d = this.distanceApproxMeters(lat, lon, n.lat, n.lon);
                  if (d < bestD) {
                    bestD = d;
                    best = idx;
                  }
                }
              }
            }
            if (best !== null) break;
          }
          return best;
        }

        nearestRoadSegment(lat, lon, desiredX = 0, desiredY = 0) {
          if (!this.roadSegments.length) return null;
          const cellX = Math.floor(lat / this.segmentCellSize);
          const cellY = Math.floor(lon / this.segmentCellSize);
          let best = null;
          let bestScore = Infinity;
          for (let gx = cellX - 2; gx <= cellX + 2; gx += 1) {
            for (let gy = cellY - 2; gy <= cellY + 2; gy += 1) {
              const ids = this.roadSegmentGrid.get(`${gx}:${gy}`);
              if (!ids) continue;
              for (const segId of ids) {
                const s = this.roadSegments[segId];
                const aLat = s[0], aLon = s[1], bLat = s[2], bLon = s[3];
                const abLat = bLat - aLat;
                const abLon = bLon - aLon;
                const denom = (abLat * abLat + abLon * abLon) || 1e-9;
                const t = Math.max(0, Math.min(1, ((lat - aLat) * abLat + (lon - aLon) * abLon) / denom));
                const projLat = aLat + abLat * t;
                const projLon = aLon + abLon * t;
                const dist = this.distanceApproxMeters(lat, lon, projLat, projLon);
                const segLen = Math.hypot(abLon, abLat) || 1e-9;
                const segDirX = abLon / segLen;
                const segDirY = abLat / segLen;
                const align = Math.abs(segDirX * desiredX + segDirY * desiredY);
                const score = dist + (1 - align) * 3;
                if (score < bestScore) {
                  bestScore = score;
                  best = { projLat, projLon, segDirX, segDirY, dist };
                }
              }
            }
          }
          return best;
        }

        projectMovementToRoad(lat, lon, moveX, moveY, maxSnapMeters = 12) {
          const nearest = this.nearestRoadSegment(lat, lon, moveX, moveY);
          if (!nearest || nearest.dist > maxSnapMeters) return null;
          const along = moveX * nearest.segDirX + moveY * nearest.segDirY;
          const sign = along >= 0 ? 1 : -1;
          return {
            lat: nearest.projLat,
            lon: nearest.projLon,
            dirX: nearest.segDirX * sign,
            dirY: nearest.segDirY * sign
          };
        }

        moveToward(entity, targetLat, targetLon, metersStep) {
          const dyM = (targetLat - entity.lat) * 111320;
          const dxM = (targetLon - entity.lon) * this.metersPerLon((entity.lat + targetLat) / 2);
          const dist = Math.hypot(dxM, dyM) || 1e-9;
          if (dist <= metersStep) {
            entity.lat = targetLat;
            entity.lon = targetLon;
            return true;
          }
          const ratio = metersStep / dist;
          entity.lat += (dyM * ratio) / 111320;
          entity.lon += (dxM * ratio) / this.metersPerLon(entity.lat);
          return false;
        }

        findPath(startIdx, goalIdx, maxVisited = 4500) {
          if (!this.hasRoadNetwork() || startIdx == null || goalIdx == null) return null;
          if (startIdx === goalIdx) return [startIdx];
          const queue = [startIdx];
          const prev = new Int32Array(this.roadNodes.length).fill(-1);
          prev[startIdx] = startIdx;
          let qHead = 0;
          let visited = 0;

          while (qHead < queue.length && visited < maxVisited) {
            const cur = queue[qHead++];
            visited += 1;
            const nexts = this.roadAdj[cur] || [];
            for (const nxt of nexts) {
              if (prev[nxt] !== -1) continue;
              prev[nxt] = cur;
              if (nxt === goalIdx) {
                const path = [goalIdx];
                let walk = goalIdx;
                while (walk !== startIdx) {
                  walk = prev[walk];
                  if (walk < 0) return null;
                  path.push(walk);
                }
                path.reverse();
                return path;
              }
              queue.push(nxt);
            }
          }
          return null;
        }

        randomRoadNode() {
          if (!this.hasRoadNetwork()) return null;
          return RNG.int(0, this.roadNodes.length - 1);
        }

        latLngToScreen(lat, lon) {
          const p = this.map.latLngToContainerPoint([lat, lon]);
          return { x: p.x, y: p.y };
        }

        screenToLatLng(x, y) {
          const ll = this.map.containerPointToLatLng([x, y]);
          return { lat: ll.lat, lon: ll.lng };
        }

        keepInBounds(entity) {
          const mapBounds = this.map.getBounds().pad(-0.03);
          entity.lat = Math.max(mapBounds.getSouth(), Math.min(mapBounds.getNorth(), entity.lat));
          entity.lon = Math.max(mapBounds.getWest(), Math.min(mapBounds.getEast(), entity.lon));
        }
      }

      class Player {
        constructor() {
          this.lat = CITY.lat;
          this.lon = CITY.lon;
          this.health = 100;
          this.stamina = 100;
          this.money = 1500;
          this.heat = 0;
          this.wantedTimer = 0;
          this.inVehicle = null;
          this.heading = 0;
          this.speedMps = 0;
        }

        get wantedLevel() {
          return Math.max(0, Math.min(5, Math.floor(this.heat / 20)));
        }
      }

      class Vehicle {
        constructor(lat, lon) {
          this.lat = lat;
          this.lon = lon;
          this.speed = RNG.range(4.2, 7.1);
          this.dir = RNG.range(0, Math.PI * 2);
          this.color = `hsl(${RNG.int(180, 350)} 70% 58%)`;
          this.stolen = false;
          this.driver = false;
          this.roadNode = null;
          this.roadTargetNode = null;
        }

        update(dt, mapSys) {
          if (this.driver) return;
          const roadReady = mapSys.hasRoadNetwork();
          if (roadReady) {
            if (this.roadNode === null) this.roadNode = mapSys.nearestRoadNode(this.lat, this.lon);
            if (this.roadNode !== null && this.roadTargetNode === null) {
              const opts = mapSys.roadAdj[this.roadNode] || [];
              this.roadTargetNode = opts.length ? opts[RNG.int(0, opts.length - 1)] : null;
            }
            if (this.roadTargetNode !== null) {
              const target = mapSys.roadNodes[this.roadTargetNode];
              const arrived = mapSys.moveToward(this, target.lat, target.lon, this.speed * dt);
              this.dir = Math.atan2(target.lat - this.lat, target.lon - this.lon);
              if (arrived) {
                this.roadNode = this.roadTargetNode;
                const opts = (mapSys.roadAdj[this.roadNode] || []).filter((n) => n !== this.roadNode);
                this.roadTargetNode = opts.length ? opts[RNG.int(0, opts.length - 1)] : null;
              }
            }
          } else {
            if (Math.random() < 0.02) this.dir += RNG.range(-0.7, 0.7);
            this.lat += Math.sin(this.dir) * this.speed * dt * 0.000018;
            this.lon += Math.cos(this.dir) * this.speed * dt * 0.000028;
          }
          mapSys.keepInBounds(this);
        }
      }

      class Police {
        constructor(lat, lon) {
          this.lat = lat;
          this.lon = lon;
          this.speed = RNG.range(5.2, 7.6);
          this.blink = 0;
          this.dir = 0;
          this.path = [];
          this.pathPos = 0;
          this.repathIn = RNG.range(0.2, 0.8);
        }

        update(dt, player, mapSys) {
          this.repathIn -= dt;
          if (mapSys.hasRoadNetwork()) {
            if (this.repathIn <= 0 || this.pathPos >= this.path.length) {
              const start = mapSys.nearestRoadNode(this.lat, this.lon, 3);
              const goal = mapSys.nearestRoadNode(player.lat, player.lon, 3);
              const path = mapSys.findPath(start, goal);
              this.path = path && path.length > 1 ? path : [];
              this.pathPos = this.path.length > 1 ? 1 : 0;
              this.repathIn = RNG.range(0.8, 1.4);
            }

            if (this.pathPos < this.path.length) {
              const node = mapSys.roadNodes[this.path[this.pathPos]];
              this.dir = Math.atan2(node.lat - this.lat, node.lon - this.lon);
              const arrived = mapSys.moveToward(this, node.lat, node.lon, this.speed * dt);
              if (arrived) this.pathPos += 1;
            } else {
              this.dir = Math.atan2(player.lat - this.lat, player.lon - this.lon);
              mapSys.moveToward(this, player.lat, player.lon, this.speed * dt * 0.85);
            }
          } else {
            this.dir = Math.atan2(player.lat - this.lat, player.lon - this.lon);
            mapSys.moveToward(this, player.lat, player.lon, this.speed * dt * 0.95);
          }
          mapSys.keepInBounds(this);
          this.blink += dt * 9;
        }
      }

      class GameManager {
        constructor() {
          this.mapSystem = new MapSystem();
          this.player = new Player();
          this.vehicles = [];
          this.police = [];
          this.joystick = new Joystick(dom.joystick, dom.joyKnob);

          this.canvas = dom.canvas;
          this.ctx = this.canvas.getContext('2d', { alpha: true });
          this.pixelRatio = Math.min(2, window.devicePixelRatio || 1);
          this.lastTime = performance.now();
          this.runPressed = false;
          this.runLocked = false;
          this.brakePressed = false;
          this.keyState = { up: false, down: false, left: false, right: false, run: false, brake: false };
          this.effects = [];
          this.lastInteractAt = 0;
        }

        async init() {
          dom.loadDetail.textContent = 'Chargement de la carte Leaflet...';
          this.mapSystem.initMap();
          this.wireUI();
          this.resize();

          this.spawnVehicles(18);
          requestAnimationFrame((t) => this.loop(t));

          setTimeout(() => {
            dom.loadingOverlay.classList.add('hidden');
            setTimeout(() => dom.loadingOverlay.remove(), 500);
          }, 500);

          await this.mapSystem.loadRoadsOptional();
        }

        wireUI() {
          window.addEventListener('resize', () => this.resize());

          const setRun = (active) => {
            this.runPressed = active;
            dom.runBtn.style.background = active ? 'rgba(30,58,138,0.92)' : 'rgba(15,23,42,0.86)';
          };

          const bindHold = (button, onStart, onEnd) => {
            button.addEventListener('pointerdown', (e) => { e.preventDefault(); onStart(); }, { passive: false });
            window.addEventListener('pointerup', onEnd, { passive: true });
            window.addEventListener('pointercancel', onEnd, { passive: true });
          };

          bindHold(dom.runBtn, () => setRun(true), () => setRun(false));
          bindHold(dom.brakeBtn, () => { this.brakePressed = true; }, () => { this.brakePressed = false; });

          dom.interactBtn.addEventListener('click', () => this.toggleVehicle());
          dom.crimeBtn.addEventListener('click', () => this.commitCrime());
          dom.zoomIn.addEventListener('click', () => this.mapSystem.map.zoomIn());
          dom.zoomOut.addEventListener('click', () => this.mapSystem.map.zoomOut());

          window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (PREVENT_DEFAULT_KEYS.has(key)) e.preventDefault();
            const mapped = KEY_ALIAS[key];
            if (mapped) this.keyState[mapped] = true;
            if (e.key.toLowerCase() === 'e') this.toggleVehicle();
            if (e.key.toLowerCase() === 'f') this.commitCrime();
          }, { passive: false });
          window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (PREVENT_DEFAULT_KEYS.has(key)) e.preventDefault();
            const mapped = KEY_ALIAS[key];
            if (mapped) this.keyState[mapped] = false;
          }, { passive: false });

          this.mapSystem.map.on('move', () => this.joystick.resize());
        }

        resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          this.canvas.style.width = `${w}px`;
          this.canvas.style.height = `${h}px`;
          this.canvas.width = Math.floor(w * this.pixelRatio);
          this.canvas.height = Math.floor(h * this.pixelRatio);
          this.ctx.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
          this.joystick.resize();
        }

        spawnVehicles(count) {
          for (let i = 0; i < count; i += 1) {
            this.vehicles.push(new Vehicle(
              CITY.lat + RNG.range(-0.008, 0.008),
              CITY.lon + RNG.range(-0.012, 0.012)
            ));
          }
        }

        spawnPolice(targetCount) {
          while (this.police.length < targetCount) {
            const angle = RNG.range(0, Math.PI * 2);
            const dist = RNG.range(0.004, 0.012);
            this.police.push(new Police(
              this.player.lat + Math.sin(angle) * dist,
              this.player.lon + Math.cos(angle) * dist
            ));
          }
        }

        commitCrime() {
          const gain = RNG.int(9, 28);
          this.player.heat = Math.min(100, this.player.heat + gain);
          this.player.money += RNG.int(50, 220);
          this.player.wantedTimer = 32;
          this.effects.push({ x: 0, y: 0, t: 0.8, type: 'crime' });
          dom.statusMsg.textContent = `Crime commis: +${gain} heat.`;
          dom.statusMsg.className = 'status error';
          const needed = Math.max(0, this.player.wantedLevel);
          if (needed > 0) this.spawnPolice(needed * 2);
        }

        nearestVehicle(maxMeters = 36) {
          let best = null;
          let bestDist = Infinity;
          for (const v of this.vehicles) {
            if (v.driver && this.player.inVehicle !== v) continue;
            const d = this.distanceMeters(this.player.lat, this.player.lon, v.lat, v.lon);
            if (d < bestDist) {
              bestDist = d;
              best = v;
            }
          }
          return bestDist <= maxMeters ? best : null;
        }

        toggleVehicle() {
          const now = performance.now();
          if (now - this.lastInteractAt < 260) return;
          this.lastInteractAt = now;

          if (this.player.inVehicle) {
            const car = this.player.inVehicle;
            car.driver = false;
            this.player.inVehicle = null;
            const offset = 4.2;
            const latOff = (Math.sin(this.player.heading + Math.PI / 2) * offset) / 111320;
            const lonOff = (Math.cos(this.player.heading + Math.PI / 2) * offset) / this.mapSystem.metersPerLon(this.player.lat);
            this.player.lat += latOff;
            this.player.lon += lonOff;
            dom.statusMsg.textContent = 'Sortie du véhicule.';
            dom.statusMsg.className = 'status';
            this.mapSystem.keepInBounds(this.player);
            return;
          }

          const near = this.nearestVehicle();
          if (!near) {
            dom.statusMsg.textContent = 'Aucun véhicule à proximité.';
            dom.statusMsg.className = 'status';
            return;
          }

          near.driver = true;
          near.stolen = true;
          this.player.inVehicle = near;
          this.player.lat = near.lat;
          this.player.lon = near.lon;
          this.player.heading = near.dir;
          this.player.heat = Math.min(100, this.player.heat + 12);
          this.player.wantedTimer = Math.max(this.player.wantedTimer, 20);
          dom.statusMsg.textContent = 'Véhicule volé!';
          dom.statusMsg.className = 'status error';
        }

        distanceMeters(lat1, lon1, lat2, lon2) {
          const R = 6371000;
          const p1 = lat1 * Math.PI / 180;
          const p2 = lat2 * Math.PI / 180;
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = Math.sin(dLat / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dLon / 2) ** 2;
          return 2 * R * Math.asin(Math.sqrt(a));
        }

        collectInput() {
          let x = this.joystick.vec.x + (this.keyState.right ? 1 : 0) - (this.keyState.left ? 1 : 0);
          let y = this.joystick.vec.y + (this.keyState.down ? 1 : 0) - (this.keyState.up ? 1 : 0);

          const len = Math.hypot(x, y);
          if (len > 1) {
            x /= len;
            y /= len;
          }

          const keyboardActive = this.keyState.up || this.keyState.down || this.keyState.left || this.keyState.right;
          const force = Math.max(this.joystick.vec.force, keyboardActive ? 1 : 0);
          return { x, y, force };
        }

        update(dt) {
          const input = this.collectInput();
          const sprint = this.runPressed || this.keyState.run;
          const braking = this.brakePressed || this.keyState.brake;

          const walk = 1.7;
          const run = 3.2;
          const carSpeed = 6.8;

          if (this.player.inVehicle) {
            const car = this.player.inVehicle;
            let speed = carSpeed * input.force;
            if (sprint) speed *= 1.22;
            if (braking) speed *= 0.35;

            const moveX = input.x;
            const moveY = input.y;
            const angle = Math.atan2(moveY, moveX || 0.0001);

            if (input.force > 0.02) {
              this.player.heading = angle;
              let dirX = Math.cos(this.player.heading);
              let dirY = Math.sin(this.player.heading);
              const projected = this.mapSystem.projectMovementToRoad(this.player.lat, this.player.lon, dirX, dirY, 14);
              if (projected) {
                this.player.lat = projected.lat;
                this.player.lon = projected.lon;
                dirX = projected.dirX;
                dirY = projected.dirY;
                this.player.heading = Math.atan2(dirY, dirX);
              }
              const meters = speed * dt;
              this.player.lat += (dirY * meters) / 111320;
              this.player.lon += (dirX * meters) / this.mapSystem.metersPerLon(this.player.lat);
            }

            car.lat = this.player.lat;
            car.lon = this.player.lon;
            car.dir = this.player.heading;
            this.player.speedMps = speed;
            this.player.stamina = Math.min(100, this.player.stamina + dt * 12);
          } else {
            let speed = walk * input.force;
            if (sprint && this.player.stamina > 0) {
              speed = run * input.force;
              this.player.stamina = Math.max(0, this.player.stamina - dt * (12 + input.force * 8));
            } else {
              this.player.stamina = Math.min(100, this.player.stamina + dt * 8);
            }

            if (input.force > 0.01) {
              const angle = Math.atan2(input.y, input.x || 0.0001);
              this.player.heading = angle;
              const dirX = Math.cos(this.player.heading);
              const dirY = Math.sin(this.player.heading);
              const meters = speed * dt;
              this.player.lat += (dirY * meters) / 111320;
              this.player.lon += (dirX * meters) / this.mapSystem.metersPerLon(this.player.lat);
            }
            this.player.speedMps = speed;
          }

          this.mapSystem.keepInBounds(this.player);

          const map = this.mapSystem.map;
          const c = map.getCenter();
          if (Math.abs(c.lat - this.player.lat) > 0.00004 || Math.abs(c.lng - this.player.lon) > 0.00004) {
            map.panTo([this.player.lat, this.player.lon], { animate: false });
          }

          for (const v of this.vehicles) v.update(dt, this.mapSystem);

          const wanted = this.player.wantedLevel;
          if (wanted > 0) {
            this.spawnPolice(wanted * 2);
            for (const p of this.police) p.update(dt, this.player, this.mapSystem);

            for (const p of this.police) {
              const d = this.distanceMeters(this.player.lat, this.player.lon, p.lat, p.lon);
              if (d < 10) {
                this.player.health = Math.max(0, this.player.health - dt * (wanted * 1.4));
                this.player.heat = Math.min(100, this.player.heat + dt * 2.1);
              }
            }
          }

          if (this.player.wantedTimer > 0) {
            this.player.wantedTimer -= dt;
          } else {
            this.player.heat = Math.max(0, this.player.heat - dt * (this.player.inVehicle ? 1.1 : 1.9));
            if (this.player.heat <= 0.5 && this.police.length > 0) {
              this.police.length = 0;
              dom.statusMsg.textContent = 'Recherche terminée, secteur calme.';
              dom.statusMsg.className = 'status ok';
            }
          }

          for (const fx of this.effects) fx.t -= dt;
          this.effects = this.effects.filter((fx) => fx.t > 0);

          if (this.player.health <= 0) {
            this.player.health = 100;
            this.player.heat = 0;
            this.player.wantedTimer = 0;
            this.player.money = Math.max(0, this.player.money - 300);
            this.player.lat = CITY.lat;
            this.player.lon = CITY.lon;
            this.police.length = 0;
            this.player.inVehicle = null;
            dom.statusMsg.textContent = 'Tu as été neutralisé. Réapparition en ville.';
            dom.statusMsg.className = 'status error';
          }

          this.updateHud();
        }

        updateHud() {
          dom.healthBar.style.width = `${this.player.health.toFixed(0)}%`;
          dom.staminaBar.style.width = `${this.player.stamina.toFixed(0)}%`;
          dom.healthText.textContent = `${this.player.health.toFixed(0)}`;
          dom.staminaText.textContent = `${this.player.stamina.toFixed(0)}`;
          dom.moneyText.textContent = `$${Math.floor(this.player.money)}`;
          dom.speedText.textContent = `Vitesse: ${this.player.speedMps.toFixed(1)} m/s`;

          const lvl = this.player.wantedLevel;
          dom.wantedStars.textContent = '★'.repeat(lvl) + '☆'.repeat(5 - lvl);
        }

        drawRoadHints() {
          if (!this.mapSystem.roadSegments.length) return;
          const ctx = this.ctx;
          ctx.save();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(99, 102, 241, 0.34)';
          ctx.beginPath();
          const max = Math.min(520, this.mapSystem.roadSegments.length);
          for (let i = 0; i < max; i += 1) {
            const seg = this.mapSystem.roadSegments[i];
            const a = this.mapSystem.latLngToScreen(seg[0], seg[1]);
            const b = this.mapSystem.latLngToScreen(seg[2], seg[3]);
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
          }
          ctx.stroke();
          ctx.restore();
        }

        drawEntity(lat, lon, opts) {
          const p = this.mapSystem.latLngToScreen(lat, lon);
          const ctx = this.ctx;
          const size = opts.size || 8;

          ctx.save();
          if (opts.shadow !== false) {
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(p.x + 2, p.y + size * 1.15, size * 1.2, size * 0.58, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.translate(p.x, p.y);
          ctx.rotate(opts.rot || 0);

          if (opts.type === 'player') {
            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.ellipse(-size * 0.08, size * 0.8, size * 0.46, size * 0.72, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.ellipse(size * 0.08, size * 0.7, size * 0.46, size * 0.72, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-size * 0.6, -size * 0.45, size * 1.2, size * 1.55);
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.arc(size * 0.58, 0, size * 0.32, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(size * 0.15, 0);
            ctx.lineTo(size * 1.05, 0);
            ctx.stroke();
          } else if (opts.type === 'vehicle') {
            ctx.fillStyle = opts.color;
            ctx.fillRect(-size * 1.35, -size * 0.78, size * 2.7, size * 1.56);
            ctx.fillStyle = 'rgba(17,24,39,0.8)';
            ctx.fillRect(-size * 0.68, -size * 0.56, size * 1.36, size * 1.12);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-size * 1.2, -size * 0.95, size * 0.36, size * 0.26);
            ctx.fillRect(-size * 1.2, size * 0.69, size * 0.36, size * 0.26);
            ctx.fillRect(size * 0.84, -size * 0.95, size * 0.36, size * 0.26);
            ctx.fillRect(size * 0.84, size * 0.69, size * 0.36, size * 0.26);
            ctx.fillStyle = '#fde68a';
            ctx.fillRect(size * 1.2, -size * 0.42, size * 0.18, size * 0.2);
            ctx.fillRect(size * 1.2, size * 0.22, size * 0.18, size * 0.2);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-size * 1.38, -size * 0.42, size * 0.18, size * 0.2);
            ctx.fillRect(-size * 1.38, size * 0.22, size * 0.18, size * 0.2);
          } else if (opts.type === 'police') {
            const blinkBlue = Math.floor(opts.blink || 0) % 2 === 0;
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(-size * 1.3, -size * 0.78, size * 2.6, size * 1.56);
            ctx.fillStyle = 'rgba(15,23,42,0.82)';
            ctx.fillRect(-size * 0.64, -size * 0.5, size * 1.28, size * 1.0);
            ctx.fillStyle = blinkBlue ? '#3b82f6' : '#ef4444';
            ctx.fillRect(-size * 0.2, -size * 0.9, size * 0.4, size * 0.2);
            ctx.fillStyle = blinkBlue ? '#ef4444' : '#3b82f6';
            ctx.fillRect(size * 0.2, -size * 0.9, size * 0.4, size * 0.2);
            ctx.fillStyle = '#fde68a';
            ctx.fillRect(size * 1.15, -size * 0.36, size * 0.17, size * 0.2);
            ctx.fillRect(size * 1.15, size * 0.16, size * 0.17, size * 0.2);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-size * 1.32, -size * 0.36, size * 0.17, size * 0.2);
            ctx.fillRect(-size * 1.32, size * 0.16, size * 0.17, size * 0.2);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-size * 0.1, -size * 0.85, size * 0.2, size * 0.16);
          }
          ctx.restore();
        }

        drawEffects() {
          const ctx = this.ctx;
          const center = this.mapSystem.latLngToScreen(this.player.lat, this.player.lon);

          for (const fx of this.effects) {
            if (fx.type !== 'crime') continue;
            const alpha = Math.max(0, fx.t / 0.8);
            const radius = (1 - alpha) * 90;
            ctx.save();
            ctx.strokeStyle = `rgba(239,68,68,${alpha})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }

        render() {
          this.ctx.clearRect(0, 0, this.canvas.width / this.pixelRatio, this.canvas.height / this.pixelRatio);

          this.drawRoadHints();

          for (const v of this.vehicles) {
            this.drawEntity(v.lat, v.lon, { type: 'vehicle', color: v.color, size: 10, rot: v.dir });
          }

          for (const p of this.police) {
            this.drawEntity(p.lat, p.lon, { type: 'police', size: 10, blink: p.blink, rot: p.dir });
          }

          if (!this.player.inVehicle) {
            this.drawEntity(this.player.lat, this.player.lon, {
              type: 'player',
              size: 9,
              rot: this.player.heading
            });
          }

          this.drawEffects();
        }

        loop(ts) {
          const dt = Math.min(0.033, (ts - this.lastTime) / 1000);
          this.lastTime = ts;
          this.update(dt);
          this.render();
          requestAnimationFrame((t) => this.loop(t));
        }
      }

      async function start() {
        if (!window.L || typeof window.L.map !== 'function') {
          dom.statusMsg.textContent = 'Leaflet indisponible: impossible d\'afficher la carte.';
          dom.statusMsg.className = 'status error';
          dom.loadDetail.textContent = 'Erreur: CDN Leaflet inaccessible.';
          return;
        }

        try {
          const game = new GameManager();
          await game.init();
        } catch (err) {
          console.error(err);
          dom.statusMsg.textContent = 'Erreur critique au démarrage du jeu.';
          dom.statusMsg.className = 'status error';
          dom.loadDetail.textContent = 'Le jeu a rencontré une erreur inattendue.';
        }
      }

      start();
    })();
  </script>
</body>
</html>
